name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  solutions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Every reference solution matches the expected result
        run: pytest -v
      - name: Exercise stubs import cleanly (unanswered questions are skipped)
        run: COURSE_TARGET=exercises pytest -q
